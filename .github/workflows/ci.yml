name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality-gate:
    name: Test Build Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: abcliv_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d abcliv_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/abcliv_test
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/abcliv_test
      ENCRYPTION_KEY: test-encryption-key-32-chars-long!!
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Prepare test DB
        run: npm run test:prepare

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        env:
          NODE_ENV: production
        run: npm run build
