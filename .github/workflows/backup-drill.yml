name: Backup Drill

on:
  schedule:
    - cron: "0 4 1 * *"
  workflow_dispatch:

jobs:
  backup-drill:
    name: Backup and Restore Drill
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: abcliv
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d abcliv"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/abcliv
      ENCRYPTION_KEY: test-encryption-key-32-chars-long!!
      ENCRYPTION_KEY_ROTATED_AT: 2026-01-01

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare database schema
        run: npx prisma db push --skip-generate

      - name: Create sample uploads
        run: |
          mkdir -p uploads
          echo "drill" > uploads/drill.txt

      - name: Create backup
        run: npm run backup

      - name: Run restore drill
        run: npm run backup:drill

      - name: Check secrets hygiene
        run: npm run secrets:check
